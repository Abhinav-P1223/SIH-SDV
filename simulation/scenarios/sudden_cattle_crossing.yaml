# SUDDEN_CATTLE_CROSSING
# Unmarked two-way road, explicit boundaries, no lane markings. Ego travels
# east (+x) on the left half (+y side, Indian keep-left convention). Cattle
# waits near the left road edge and begins crossing toward the right (-y) when
# the ego is within trigger_distance_m, creating a future collision with the
# ego's current path. The ego's response is NOT scripted; it must emerge from
# the autonomy stack.
#
# Sanity check of the threat (no ego reaction): trigger at 30 m -> 3.0 s before
# the ego front reaches the cattle x. Cattle ramps to 0.8 m/s and travels ~2 m
# in that time, ending at y ~ 1.2 (footprint y in [0.2, 2.2]) while the ego
# body occupies y in [0.85, 2.65]. That is a collision.
name: SUDDEN_CATTLE_CROSSING
description: Cattle near the left edge crosses an unmarked road into the ego path.
seed: 42

road:
  lane_markings: NONE
  reference:      [[0.0, 0.0], [160.0, 0.0]]
  left_boundary:  [[0.0, 3.5], [160.0, 3.5]]
  right_boundary: [[0.0, -3.5], [160.0, -3.5]]

ego:
  x: 0.0
  y: 1.75                     # left half of the corridor (+y is left when travelling +x)
  yaw_deg: 0.0
  speed_mps: 10.0
  desired_speed_mps: 10.0     # ~36 km/h, typical for an unstructured road
  desired_lateral_offset_m: 1.75    # reference offset the planner prefers to return to

goal:
  s_m: 140.0

agents:
  - id: cattle_1
    type: CATTLE
    x: 60.0
    y: 3.1                    # near the left edge, on the ego's side
    heading_deg: -90.0        # crossing toward -y (right)
    speed_mps: 0.0
    behavior: CROSSING
    params:
      trigger_distance_m: 30.0
      crossing_speed_mps: 0.8
      acceleration_mps2: 1.5
      crossing_distance_m: 6.0
      stop_after: true
