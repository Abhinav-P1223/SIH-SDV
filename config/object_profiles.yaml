# Behaviour profiles per object type. Used by prediction (uncertainty growth)
# and risk (type weighting). The planner never reads these directly.
#
# sigma_pos0_m   : initial positional std-dev (Stage 1: ground truth, small)
# sigma_vel_mps  : velocity uncertainty -> linear growth of position std-dev
# sigma_acc_mps2 : acceleration uncertainty -> quadratic growth
# risk_weight    : multiplies collision probability into risk_score
defaults:
  length_m: 1.0
  width_m: 1.0
  sigma_pos0_m: 0.2
  sigma_vel_mps: 0.4
  sigma_acc_mps2: 0.4
  risk_weight: 1.0

profiles:
  PEDESTRIAN:    {length_m: 0.6,  width_m: 0.6,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.6, sigma_acc_mps2: 0.6, risk_weight: 1.6}
  BICYCLE:       {length_m: 1.8,  width_m: 0.6,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.6, sigma_acc_mps2: 0.6, risk_weight: 1.4}
  MOTORCYCLE:    {length_m: 2.0,  width_m: 0.8,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.8, sigma_acc_mps2: 1.0, risk_weight: 1.4}
  AUTO_RICKSHAW: {length_m: 2.6,  width_m: 1.4,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.7, sigma_acc_mps2: 0.8, risk_weight: 1.1}
  CAR:           {length_m: 4.3,  width_m: 1.8,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.5, sigma_acc_mps2: 0.6, risk_weight: 1.0}
  BUS:           {length_m: 11.0, width_m: 2.5,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.4, sigma_acc_mps2: 0.4, risk_weight: 1.0}
  TRUCK:         {length_m: 9.0,  width_m: 2.5,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.4, sigma_acc_mps2: 0.4, risk_weight: 1.0}
  PUSHCART:      {length_m: 2.0,  width_m: 1.0,  sigma_pos0_m: 0.2, sigma_vel_mps: 0.4, sigma_acc_mps2: 0.4, risk_weight: 1.2}
  CATTLE:        {length_m: 2.0,  width_m: 0.7,  sigma_pos0_m: 0.3, sigma_vel_mps: 0.6, sigma_acc_mps2: 0.7, risk_weight: 1.4}
  UNKNOWN:       {length_m: 1.0,  width_m: 1.0,  sigma_pos0_m: 0.3, sigma_vel_mps: 0.6, sigma_acc_mps2: 0.6, risk_weight: 1.2}
